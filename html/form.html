<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pledge</title>
    <link rel="icon" href="../images/planet-earth.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="../stylesheets/navbar.css">
    <link rel="stylesheet" href="../stylesheets/form.css">
    <script src="../javascript/formSubmit.js" defer></script>
    <script src="../javascript/addActions.js" defer></script>
    <script src="../javascript/wordCounterPledge.js" defer></script>
</head>

<body class="d-flex flex-column m-0 p-0">   
    <!-- Navigation bar -->
    <header class="sticky-md-top">
        <nav class="navbar navbar-expand-lg bg-success py-3">
            <div class="container">
                <a class="navbar-brand text-center d-flex justify-content-center align-items-center" href="index.html">
                    <img src="../images/planet-earth.png" class="img-fluid d-inline-block align-text-top me-3" alt="" height="70" width="70"> <!--image from flaticon.com-->
                    <span class="fw-bold display-5 text-light">Sustainability</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#susNavBar" aria-controls="susNavBar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 fs-2" id="susNavBar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 text-light">
                        <li class="nav-item">
                            <a class="nav-link active text-light" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light" href="information.html">Information</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light" href="#">Form</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-lg container-fluid">
        <div class="row">
            <div class="col-10 col-md-8 col-lg-6 mx-auto my-5 rounded p-5 border border-dark border-3" id="pledgeFormSection">
                <div class="d-flex align-items-center justify-content-center fs-1 text-light">
                    Make Your Pledge
                </div>

                <!-- modal for error message and form submit -->
                <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header bg-danger text-white" id="modalHeader">
                                <h5 class="modal-title" id="errorModalLabel">Form Error</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body" id="modalMessage">

                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="pledgeForm" class="fw-medium text-light" novalidate>
                    <div class="form-floating my-4">
                        <input type="text" class="form-control" id="nameInput" placeholder="John">
                        <label for="nameInput">Full Name (required)</label>
                    </div>

                    <div class="form-floating my-3">
                        <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                        <label for="emailInput">Email address (required)</label>
                    </div>

                    <div class="my-4">
                        <select id="country" class="form-select py-3">
                            <option value="" disabled selected>Country</option>
                            <option value="Singapore">Singapore</option>
                            <option value="Malaysia">Malaysia</option>
                            <option value="Japan">Japan</option>
                            <option value="Korea">Korea</option>
                            <option value="China">China</option>
                            <option value="Indonesia">Indonesia</option>
                            <option value="America">America</option>
                        </select>
                    </div>

                    <div class="form-floating my-3">
                        <input type="tel" class="form-control" id="numberInput" placeholder="1234 5678">
                        <label for="numberInput">Phone Number</label>
                    </div>

                    <div class="my-4">
                        <select id="occupation" class="form-select py-3">
                            <option value="" disabled selected>Field of Work</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Education">Education</option>
                            <option value="Sales">Sales</option>
                            <option value="Law">Law</option>
                            <option value="Student">Student</option>
                            <option value="others">Others</option>
                        </select>
                    </div>

                    <div class="rounded p-2">
                        <label for="learnSus" class="form-label fs-5">How much did you learn about sustainability from this website? (1 = Nothing new, 5  = I learned a lot)</label>
                        <input type="range" class="form-range custom-slider" min="1" max="5" id="learnSus">
                        <div class="d-flex justify-content-between">
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                        </div>
                    </div>

                    <div class="rounded p-2">
                        <label for="learnAction" class="form-label fs-5">How much did you learn about climate action from this website? (1 = Nothing new, 5  = I learned a lot)</label>
                        <input type="range" class="form-range" min="1" max="5" id="learnAction">
                        <div class="d-flex justify-content-between">
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                        </div>
                    </div>

                    <div class="input-group my-4">
                        <span class="input-group-text fs-5">Make your Pledge</span>
                        <textarea class="form-control" id="pledgeText" placeholder="I pledge to..."></textarea>
                        <span aria-live="polite" class="position-absolute end-0 bottom-0 me-2 mb-1 text-muted small" id="count_message">0</span>
                    </div>

                    <label class="form-label fs-5">List some actions you will take to help fight climate change:</label>
                    <div class="input-group mb-4">
                        <input type="text" class="form-control" placeholder="I will..." aria-label="Pledge actions to fight against climate change" id="actionBox">
                        <button class="btn btn-outline-secondary px-5 text-dark border border-dark" type="button" id="addAction">Add</button>
                    </div>

                    <ul id="actionList"></ul>
                    
                    <fieldset class="mb-3">
                        <legend class="form-label fs-4">Gender:</legend>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="others" value="others">
                            <label class="form-check-label" for="others">Others</label>
                        </div>
                    </fieldset>

                    <div class="mb-3 mt-3 form-check">
                        <input type="checkbox" class="form-check-input" id="emailResponse">
                        <label class="form-check-label" for="emailResponse">Would you like to receive a copy of your response?</label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="tnc">
                        <label class="form-check-label" for="tnc">I agree to the terms and conditions</label>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button id="submitBtn" type="submit" class="btn btn-primary p-2 fs-4">Submit</button>
                    </div>
                    

                </form>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="mt-auto bg-dark text-light">
        <div class="container text-center d-flex flex-column justify-content-center align-items-center" id="footerContent">
            <span>&copy; 2025 Sustainability Matters. Made by Huang Jia Wei.</span>
            <a href="#">Back to top</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>


</body>
</html>
